[project]
name = "ml-zoomcamp-2026"
version = "0.1.0"
description = "Personal workspace for DataTalksClub Machine Learning Zoomcamp 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[project.optional-dependencies]
trees = [
    "xgboost>=2.1",
]
deployment = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]
deep-learning = [
    "pillow>=10.4",
    "tensorflow>=2.17",
]
serverless = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlzoomcamp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"modules/**/workbook.py" = ["F401"]
